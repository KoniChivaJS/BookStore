# MongoDB (docker container: bookstore-mongo, no auth)
spring.data.mongodb.uri=mongodb://localhost:27017/bookstore

# Server
server.port=8080

# Pretty JSON in responses (handy while testing)
spring.jackson.serialization.indent-output=true
